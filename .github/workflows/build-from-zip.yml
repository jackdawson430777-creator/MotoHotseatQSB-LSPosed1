
name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'MotoHotseatQSB-LSPosed-project.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          unzip -o MotoHotseatQSB-LSPosed-project.zip -d extracted
          find extracted -name settings.gradle -o -name settings.gradle.kts
          test -f extracted/MotoHotseatQSB-LSPosed/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/MotoHotseatQSB-LSPosed
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoHotseatQSB-LSPosed-debug
          path: extracted/MotoHotseatQSB-LSPosed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
