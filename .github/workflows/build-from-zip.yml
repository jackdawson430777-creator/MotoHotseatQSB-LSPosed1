
name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'MotoHotseatQSB-LSPosed-project.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project ZIP
        run: |
          unzip MotoHotseatQSB-LSPosed-project.zip
          test -f MotoHotseatQSB-LSPosed/app/build.gradle

      - name: Build APK
        working-directory: MotoHotseatQSB-LSPosed
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoHotseatQSB-LSPosed-debug
          path: MotoHotseatQSB-LSPosed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
